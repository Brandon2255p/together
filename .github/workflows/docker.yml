name: Docker

# Test-builds the image (nothing is pushed), then starts it and checks it answers.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: together:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # the stub backend, so the container runs without a Supabase stack
          build-args: |
            NEXT_PUBLIC_USE_STUB_DATABASE=true

      - name: Run
        run: docker run -d --name together -p 3000:3000 -e USE_STUB_DATABASE=true together:ci

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' together)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs together
          exit 1

      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS -o /dev/null -w "sign-in %{http_code}\n" http://localhost:3000/sign-in
          curl -fsS -o /dev/null -w "home %{http_code}\n" http://localhost:3000/home
          curl -fsS -o /dev/null -w "design-system %{http_code}\n" http://localhost:3000/design-system
          curl -fsS -o /dev/null -w "sw.js %{http_code}\n" http://localhost:3000/sw.js
          curl -fsS -o /dev/null -w "manifest %{http_code}\n" http://localhost:3000/manifest.webmanifest

      - name: Logs
        if: always()
        run: docker logs together || true

  migrate:
    name: Migrations apply to Supabase Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Supabase Postgres (same image as production)
        run: |
          docker network create mig
          docker run -d --name db --network mig -e POSTGRES_PASSWORD=ci \
            supabase/postgres:15.8.1.085 postgres -c config_file=/etc/postgresql/postgresql.conf
          for i in $(seq 1 60); do docker exec db pg_isready -U postgres -h 127.0.0.1 -q && break; sleep 2; done
          sleep 5
      - name: Build and run the migrate image
        run: |
          docker build -t together-migrate -f supabase/migrate/Dockerfile supabase
          docker run -d --name migrate --network mig -e PGHOST=db -e PGUSER=postgres -e PGPASSWORD=ci \
            -e PGDATABASE=postgres together-migrate
      - name: Wait until migrated (and still running)
        run: |
          for i in $(seq 1 60); do docker exec migrate test -f /tmp/migrated && break; sleep 2; done
          docker exec migrate test -f /tmp/migrated
          test "$(docker inspect -f '{{.State.Running}}' migrate)" = true
      - name: Restart applies nothing twice
        run: |
          docker restart migrate
          for i in $(seq 1 30); do docker exec migrate test -f /tmp/migrated && break; sleep 2; done
          docker exec migrate test -f /tmp/migrated
          test "$(docker exec db psql -U postgres -h 127.0.0.1 -tAc 'select count(*) from supabase_migrations.schema_migrations')" = "$(ls supabase/migrations/*.sql | wc -l)"
      - name: Logs
        if: always()
        run: docker logs migrate || true

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every file bind mount has inline content
        # Coolify doesn't copy the repo to the server. A bind source without `content:` turns into an empty
        # directory, and the service crashes (that's how Vector failed).
        run: |
          yq -e '[.services[].volumes[] | select(tag == "!!map" and .type == "bind" and (.source | test("^\./")) and (has("content") | not)) | .source] | length == 0' docker-compose.yml \
            || { echo "::error::a ./ bind mount in docker-compose.yml has no content:"; exit 1; }
      - name: docker compose config
        # Coolify fills SERVICE_* in production; any value will do to check the file parses. exclude_from_hc and
        # volume `content` are Coolify-only keys that plain Compose rejects, so they're dropped for the check.
        run: |
          for v in $(grep -oE '\$\{[A-Z0-9_]+' docker-compose.yml | tr -d '${' | sort -u); do export "$v=ci"; done
          yq 'del(.services[].exclude_from_hc) | del(.services[].volumes[] | select(tag == "!!map") | .content)' docker-compose.yml > /tmp/compose.yml
          docker compose -f /tmp/compose.yml --project-directory . config --quiet
